name: Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "compose.yaml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "compose.yaml"
      - ".github/workflows/docker-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build image + container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest coqui server version
        id: ver
        run: |
          V="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
               https://api.github.com/repos/carmelosantana/coqui/releases/latest \
               | grep '"tag_name"' | head -1 | sed 's/.*"tag_name"[^"]*"\([^"]*\)".*/\1/')"
          V="${V#v}"
          [ -n "$V" ] || { echo "could not resolve coqui server version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved server version: $V"

      - name: Build image (web stub)
        run: |
          docker build \
            --build-arg COQUI_VERSION="${{ steps.ver.outputs.version }}" \
            --build-arg COQUI_WEB_STUB=1 \
            -t coqui-ci:smoke .

      - name: Boot container
        run: docker run -d --name coqui-ci -p 8080:8080 coqui-ci:smoke

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "healthy after ${i} tries"; exit 0
            fi
            sleep 3
          done
          echo "container did not become healthy"; docker logs coqui-ci; exit 1

      - name: Assert / serves with COOP/COEP
        run: |
          headers="$(curl -sD - -o /dev/null http://localhost:8080/)"
          echo "$headers"
          echo "$headers" | grep -iq '^HTTP/.* 200' || { echo "no 200 on /"; exit 1; }
          echo "$headers" | grep -iq 'Cross-Origin-Opener-Policy: *same-origin' || { echo "missing COOP"; exit 1; }
          echo "$headers" | grep -iq 'Cross-Origin-Embedder-Policy: *require-corp' || { echo "missing COEP"; exit 1; }

      - name: Assert /api/* proxies to a healthy API
        run: |
          body="$(curl -fsS http://localhost:8080/api/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "api health not ok"; exit 1; }

      - name: Assert /config.json advertises the bundled deployment
        run: |
          headers="$(curl -sD - -o /dev/null http://localhost:8080/config.json)"
          echo "$headers"
          echo "$headers" | grep -iq '^HTTP/.* 200' || { echo "no 200 on /config.json"; exit 1; }
          echo "$headers" | grep -iq 'Content-Type: *application/json' || { echo "config.json not served as JSON"; exit 1; }
          body="$(curl -fsS http://localhost:8080/config.json | tr -d '\n')"
          echo "$body"
          [ "$body" = '{"bundled":true,"apiBaseUrl":"/api/v1"}' ] || { echo "unexpected config.json body"; exit 1; }
          # 39 is the exact byte count of the contract string above; the body
          # comparison strips newlines, so this is what catches a stray trailing
          # newline or any other padding. Update it if the contract ever changes.
          echo "$headers" | grep -iq 'Content-Length: *39' || { echo "config.json body is not exactly 39 bytes"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker logs coqui-ci || true

      - name: Teardown
        if: always()
        run: docker rm -f coqui-ci || true
